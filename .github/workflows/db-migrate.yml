# Reusable DB migration job. Called from a future deploy workflow via:
#   uses: ./.github/workflows/db-migrate.yml
#   secrets: { DATABASE_URL: ${{ secrets.DATABASE_URL }} }

name: db-migrate

on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
