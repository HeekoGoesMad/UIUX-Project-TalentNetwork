name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # drizzle-kit check validates migration snapshots offline; no DATABASE_URL needed.
      - run: npm run db:check

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test e2e/route-parity.spec.ts e2e/jobs-assessment-smoke.spec.ts e2e/admin-gate.spec.ts
        env:
          CI: true

      - run: npm run test:unit

      - run: npm run build
