name: Database Migration (Development)

on:
  push:
    branches:
      - dev
    paths:
      - "drizzle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migration-development
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Pending Migrations to Dev Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Offline migration sanity check
        run: npm run db:check

      - name: Validate database credentials are provided
        run: |
          RESOLVED_DB="${DEV_DATABASE_URL:-}"
          RESOLVED_DIR="${DEV_DIRECT_URL:-}"
          if [ -z "$RESOLVED_DB" ] && [ -z "$RESOLVED_DIR" ]; then
            echo "::error::Neither DEV_DATABASE_URL nor DEV_DIRECT_URL secret is configured in GitHub repository secrets."
            exit 1
          fi
          echo "Dev database credentials successfully resolved."
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}

      - name: Apply pending database migrations
        run: |
          RESOLVED_DB="${DEV_DATABASE_URL:-}"
          RESOLVED_DIR="${DEV_DIRECT_URL:-}"
          if [ -n "$RESOLVED_DIR" ]; then
            export DIRECT_URL="$RESOLVED_DIR"
          fi
          export DATABASE_URL="$RESOLVED_DB"
          npm run db:migrate
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}

      - name: Verify database schema parity
        run: |
          RESOLVED_DB="${DEV_DATABASE_URL:-}"
          RESOLVED_DIR="${DEV_DIRECT_URL:-}"
          if [ -n "$RESOLVED_DIR" ]; then
            export DIRECT_URL="$RESOLVED_DIR"
          fi
          export DATABASE_URL="$RESOLVED_DB"
          npm run db:verify
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          DEV_DIRECT_URL: ${{ secrets.DEV_DIRECT_URL }}
